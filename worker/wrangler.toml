# ニュース更新を5分ごとに起動する Cloudflare Worker の設定
name = "daily-news-trigger"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
REPO = "ataisaikyou/daily-news"
WORKFLOW = "update.yml"
GITHUB_API = "https://api.github.com"
# 全ニュースを取り直す間隔（分）。この倍数の時刻（毎時0分・30分）に取り直す
FULL_EVERY_MIN = "30"
# 「今すぐ更新」ボタンを置くサイト（カンマ区切りで複数可）
ALLOWED_ORIGINS = "https://ataisaikyou.github.io"

# GITHUB_TOKEN（このリポジトリの Actions 読み書き権限だけを持つトークン）は
# `npx wrangler secret put GITHUB_TOKEN` で登録する（ファイルには書かない）
