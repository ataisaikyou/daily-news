name: ニュース更新

on:
  schedule:
    - cron: '7 * * * *' # 毎時7分（UTC基準。混雑時は数分〜数十分遅れることがある）
  workflow_dispatch:    # Actions 画面の「Run workflow」で手動実行
  push:
    branches: [main]

permissions:
  contents: write # 自動停止対策の空コミット用
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # 公開リポジトリは60日間コミットがないと定期実行が自動で止まるため、
      # 最終コミットから50日たったら空コミットして止まらないようにする
      - name: 定期実行の自動停止を防ぐ
        if: github.event_name == 'schedule'
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "最終コミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 定期実行の自動停止を防ぐ"
            git push
          fi
