name: ニュース更新
# Worker が「今すぐ更新」の進み具合を探すのに使うので、全ニュース更新のときは名前をそろえる
run-name: ${{ (github.event_name == 'push' || inputs.full) && '全ニュース更新' || '定期更新' }}

on:
  # 5分ごとの起動は Cloudflare Worker（worker/）が workflow_dispatch で行う
  # GitHub の定期実行は遅延・欠落が多いので、Worker が止まったとき用の予備として残す
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:    # Worker からの起動、または Actions 画面の「Run workflow」
    inputs:
      full:
        description: '30分を待たずに全ニュースを取り直す'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write # 自動停止対策の空コミット用
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # push と「全ニュース更新」の指定があるときは30分を待たずに全ニュースを取り直す
          FORCE_FULL: ${{ (github.event_name == 'push' || inputs.full) && '1' || '' }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # 公開リポジトリは60日間コミットがないと定期実行（予備）が自動で止まるため、
      # 最終コミットから50日たったら空コミットして止まらないようにする
      - name: 定期実行の自動停止を防ぐ
        if: github.event_name != 'push'
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "最終コミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 定期実行の自動停止を防ぐ"
            git push
          fi
