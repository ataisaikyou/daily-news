name: ニュース更新
# Worker が実行の種類（「今すぐ更新」の進み具合、5分更新を見送るか）を見分けるのに使う
run-name: ${{ (github.event_name == 'push' || inputs.manual) && '手動更新' || inputs.full && '全ニュース更新' || github.event_name == 'schedule' && '予備の定期更新' || '速報更新' }}

on:
  # 5分の倍数の時刻の起動は Cloudflare Worker（worker/）が workflow_dispatch で行う
  # GitHub の定期実行は遅延・欠落が多いので、Worker が止まったとき用の予備として残す
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:    # Worker からの起動、または Actions 画面の「Run workflow」
    inputs:
      full:
        description: '全ニュースを取り直す'
        type: boolean
        default: true
      manual:
        description: '「今すぐ更新」ボタンからの手動更新'
        type: boolean
        default: false
      at:
        description: '定期更新の予定時刻（ミリ秒。更新時刻として記録する）'
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: write # 自動停止対策の空コミット用
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: build
        run: npm run build
        env:
          # push・手動更新・全ニュース更新のときは全ニュースを取り直す
          FORCE_FULL: ${{ (github.event_name == 'push' || inputs.manual || inputs.full) && '1' || '' }}
          UPDATE_AT: ${{ inputs.at }}
          # 予備の定期実行は、Worker からの更新が動いていれば何もしない（skip=true を出力する）
          BACKUP: ${{ github.event_name == 'schedule' && '1' || '' }}

      - if: steps.build.outputs.skip != 'true'
        uses: actions/configure-pages@v6

      - if: steps.build.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        if: steps.build.outputs.skip != 'true'
        uses: actions/deploy-pages@v5

      # 公開リポジトリは60日間コミットがないと定期実行（予備）が自動で止まるため、
      # 最終コミットから50日たったら空コミットして止まらないようにする
      - name: 定期実行の自動停止を防ぐ
        if: github.event_name != 'push'
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "最終コミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 定期実行の自動停止を防ぐ"
            git push
          fi
